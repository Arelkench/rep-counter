server {
  listen 80;
  root /usr/share/nginx/html;

  # Same origin as the page: /api/sessions -> http://api:3000/sessions (the trailing slash strips /api).
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
